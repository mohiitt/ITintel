[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itintel"
version = "0.1.0"
description = "IT Service Desk Intelligence — reproducible operations analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "ITintel" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "xgboost>=2.1",
  "matplotlib>=3.9",
  "joblib>=1.4",
  "boto3>=1.35",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
itintel = "itintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
